name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装锁定依赖
        run: python -m pip install -r requirements.txt
      - name: 全量单测
        run: python -m pytest tests -q
      - name: M0 验收门
        run: python tools/acceptance/run_m0_checks.py
